name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Production deploys must not overlap, and must run in push order. The live
# check asserts that the public domain serves THIS run's commit; if two merges
# to main ran concurrently, the first run's check would see the second commit
# and fail spuriously. The group is taken at WORKFLOW level, not on the deploy
# job: a job-level group is only acquired once that job's `needs` finish, so a
# push whose lint/typecheck/unit jobs ran slower could reach the deploy job
# second and promote an older commit over a newer one, rolling production
# back. Main pushes queue rather than cancel (cancel-in-progress: false) so a
# deploy is never killed half-way. GitHub keeps only ONE pending run per group:
# a newer queued run supersedes an older pending one, which is cancelled. That
# is acceptable because the newer commit contains the older one. PR runs (and
# anything that is not a push to main) get a group unique to the run, so they
# never queue behind each other or behind a production deploy.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'production-deploy' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  # Exact Vercel CLI version for every `vercel` invocation. It is pinned
  # because an unpinned `pnpm dlx vercel` meant the deploy behaviour could change
  # between two merges with nothing in the diff to explain it. Bump deliberately.
  VERCEL_CLI_VERSION: "62.1.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm prisma generate
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost/placeholder"
          DATABASE_URL_UNPOOLED: "postgresql://placeholder:placeholder@localhost/placeholder"
      - run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm prisma generate
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost/placeholder"
          DATABASE_URL_UNPOOLED: "postgresql://placeholder:placeholder@localhost/placeholder"
      - run: pnpm typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm prisma generate
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost/placeholder"
          DATABASE_URL_UNPOOLED: "postgresql://placeholder:placeholder@localhost/placeholder"
      - run: pnpm test
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}

  build-test-deploy:
    name: Build → E2E → Deploy
    needs: [lint, typecheck, unit-tests]
    runs-on: ubuntu-latest
    # Load-bearing for the branch reaper below, not just a runaway-cost guard.
    # The reaper deletes any `ci-run-*` branch older than 3h; without a timeout a
    # job could exceed that (GitHub's default is 6h) and have a concurrently
    # starting run delete the branch out from under it. Capping the job well
    # under the reaper cutoff makes that impossible. A normal run takes ~15min.
    timeout-minutes: 45
    env:
      # DATABASE_URL / DATABASE_URL_UNPOOLED are deliberately NOT set here. The
      # "Create ephemeral Neon branch" step below writes them into $GITHUB_ENV,
      # pointing at a Neon branch created for this run alone and deleted when the
      # job ends. Do not add them back as job-level env: job-level env wins over
      # $GITHUB_ENV and would silently send E2E at a shared database again.
      #
      # Nothing in this job may touch production. E2E creates hundreds of users
      # per run; production is migrated by its own step below, immediately before
      # the deploy, from PRODUCTION_DATABASE_URL only.
      NEON_API: "https://console.neon.tech/api/v2"
      NEON_PROJECT_ID: "quiet-fog-92876233"
      # `ci-base` — an empty root branch (no parent, no data, no schema). Every
      # run branches from it, so `prisma migrate deploy` builds the schema from
      # zero and CI never sees a copy of production or of another run's rows.
      NEON_CI_BASE_BRANCH_ID: "br-morning-band-a9yuaa6k"
      # Namespaces this run's app-level cache keys. The database is fresh each
      # run but Upstash is shared, and cache keys are built from the fixed seed
      # project id — without this, a previous run's cached list response could be
      # served against a database that never held those rows. See src/lib/cache.ts.
      CACHE_NAMESPACE: ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Same reasoning for rate-limit buckets, but this one is a security fix
      # rather than a correctness one: resetRateLimits() runs in every beforeEach
      # and deletes under this prefix. Unnamespaced it matched the bare
      # `@upstash/ratelimit:*`, i.e. production's own brute-force counters on the
      # shared Upstash instance. src/lib/rate-limit-key.ts refuses to build a
      # purge target when this is unset, so dropping it fails the run rather than
      # silently widening the blast radius again.
      RATELIMIT_NAMESPACE: ci-${{ github.run_id }}-${{ github.run_attempt }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      # E2E uses the local-only stub transport. Keep placeholders so env.ts
      # still exercises its production-shaped configuration contract without
      # granting this workflow access to Resend credentials.
      EMAIL_TRANSPORT: "stub"
      RESEND_API_KEY: "re_e2e_dummy_key"
      RESEND_FROM_EMAIL: "e2e@evidoxa.test"
      # E2E runs against a production build on localhost, which is not a
      # deployment. Opt in to the dev-only routes the smoke suite exercises.
      E2E_ALLOW_DEV_ROUTES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile

      # Neon's free plan caps the project at 10 branches, so a run cancelled
      # between "create" and "delete" below can eventually block every later run.
      # Branches also carry an expires_at (see below) as the real safety net;
      # this step just keeps the branch list tidy sooner. Matching is anchored on
      # the `ci-run-` prefix so the long-lived `ci`, `ci-base`, `dev` and
      # `production` branches can never be selected.
      - name: Reap leaked ephemeral Neon branches
        continue-on-error: true
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)"
          stale="$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "$NEON_API/projects/$NEON_PROJECT_ID/branches" \
            | jq -r --arg cutoff "$cutoff" '
                .branches[]
                | select(.name | startswith("ci-run-"))
                | select(.created_at < $cutoff)
                | "\(.id) \(.name)"')"
          if [ -z "$stale" ]; then echo "No leaked ci-run-* branches."; exit 0; fi
          echo "$stale" | while read -r id name; do
            echo "Reaping $name ($id)"
            curl -sS -o /dev/null -w "  -> HTTP %{http_code}\n" -X DELETE \
              -H "Authorization: Bearer $NEON_API_KEY" \
              "$NEON_API/projects/$NEON_PROJECT_ID/branches/$id"
          done

      # One database per run, thrown away at the end. Branch creation is
      # copy-on-write and takes ~1s. Because the parent is empty, `migrate
      # deploy` below replays every migration from zero — which is also the only
      # place that gets tested.
      - name: Create ephemeral Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          name="ci-run-${{ github.run_id }}-${{ github.run_attempt }}"
          expires_at="$(date -u -d '+6 hours' +%Y-%m-%dT%H:%M:%SZ)"

          created="$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
                   --arg name "$name" \
                   --arg parent "$NEON_CI_BASE_BRANCH_ID" \
                   --arg expires "$expires_at" \
                   '{branch:{name:$name,parent_id:$parent,expires_at:$expires},
                     endpoints:[{type:"read_write"}]}')" \
            "$NEON_API/projects/$NEON_PROJECT_ID/branches")"

          branch_id="$(jq -r '.branch.id' <<<"$created")"
          database="$(jq -r '.databases[0].name // "neondb"' <<<"$created")"
          role="$(jq -r '.roles[0].name // "neondb_owner"' <<<"$created")"
          # Export before waiting for readiness, so the always() cleanup step can
          # still delete the branch if it never comes up.
          echo "NEON_CI_BRANCH_ID=$branch_id" >> "$GITHUB_ENV"
          echo "Created $name ($branch_id) from $NEON_CI_BASE_BRANCH_ID, expires $expires_at"

          state=""
          for _ in $(seq 1 60); do
            state="$(curl -sS -H "Authorization: Bearer $NEON_API_KEY" \
              "$NEON_API/projects/$NEON_PROJECT_ID/branches/$branch_id" \
              | jq -r '.branch.current_state')"
            [ "$state" = "ready" ] && break
            sleep 2
          done
          [ "$state" = "ready" ] || { echo "Branch stuck in state '$state'"; exit 1; }

          uri() {
            curl -sS --fail-with-body -G \
              -H "Authorization: Bearer $NEON_API_KEY" \
              --data-urlencode "branch_id=$branch_id" \
              --data-urlencode "database_name=$database" \
              --data-urlencode "role_name=$role" \
              --data-urlencode "pooled=$1" \
              "$NEON_API/projects/$NEON_PROJECT_ID/connection_uri" | jq -r '.uri'
          }
          pooled="$(uri true)"
          direct="$(uri false)"

          # These carry the role password — mask the password and both URIs
          # before they can reach the log through any later step.
          password="${pooled#*://*:}"; password="${password%%@*}"
          echo "::add-mask::$password"
          echo "::add-mask::$pooled"
          echo "::add-mask::$direct"
          echo "DATABASE_URL=$pooled" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$direct" >> "$GITHUB_ENV"

      - name: Generate Prisma Client
        run: pnpm prisma generate
        env:
          # prisma generate never connects — placeholders satisfy the schema validator
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost/placeholder"
          DATABASE_URL_UNPOOLED: "postgresql://placeholder:placeholder@localhost/placeholder"

      # Migrations require a direct (non-pooled) connection for both vars.
      # DATABASE_URL_UNPOOLED comes from $GITHUB_ENV (this run's branch); it is
      # referenced as a shell variable rather than a ${{ }} expression so the
      # value can only ever be the one the create step exported.
      - name: Run DB migrations
        run: DATABASE_URL="$DATABASE_URL_UNPOOLED" pnpm prisma migrate deploy

      # Issue #122: content/roadmap-status.json is a committed artifact that
      # only refreshes when a human reruns `roadmap:status:generate` by hand,
      # so /roadmap can silently show stale epic state. This runner already
      # has `gh` preinstalled, and GH_TOKEN below authenticates it, so the
      # existing generator (scripts/roadmap-status.ts) runs unchanged here —
      # no fetch rewrite, no new secret. The refreshed file feeds this build
      # only; it is NOT committed back (see the generator's own header for
      # why: the repo copy is a development fallback / last-known-good, not
      # something CI should keep "fixing").
      #
      # This must never fail the deploy. A stale status page is a bad look;
      # a deploy blocked because GitHub was briefly unreachable or the
      # generator hiccuped is worse — the committed artifact is right there
      # as a fine fallback, and its `generatedAt` field (read by the page)
      # makes any staleness visible rather than silent. Written to a temp
      # file and moved into place only on success, so a failed/partial run
      # can never truncate the committed fallback to empty or garbage JSON.
      - name: Refresh roadmap status artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if pnpm --silent roadmap:status > content/roadmap-status.json.tmp; then
            mv content/roadmap-status.json.tmp content/roadmap-status.json
            echo "Refreshed content/roadmap-status.json."
          else
            rm -f content/roadmap-status.json.tmp
            echo "::warning::Could not refresh content/roadmap-status.json (GitHub unreachable or generator error). Falling back to the committed copy for this build."
          fi

      - name: Build
        run: pnpm build

      - name: Seed database
        run: DATABASE_URL="$DATABASE_URL_UNPOOLED" pnpm prisma db seed
        env:
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}

      # Without these, a failing E2E run leaves nothing to debug with: the
      # per-test error-context.md holds the rendered page snapshot that shows
      # *why* a step failed, and the trace allows a full replay.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      # CI's migrate step above runs against this run's throwaway branch, so
      # production would otherwise never receive migrations — Vercel's build only
      # runs `prisma generate && next build`. This is the only step in the
      # workflow that touches the production database, and it deliberately does
      # not seed: seeding production is what put a known admin credential there
      # (audit C2). It reads PRODUCTION_DATABASE_URL directly and never the
      # DATABASE_URL* pair, which by this point points at the ephemeral branch.
      - name: Migrate production database
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.PRODUCTION_DATABASE_URL }}

      # Deploy, promote and verify are three steps on purpose. The project's
      # "auto-assign custom domains" setting is off and is not visible in the
      # dashboard, so a plain `vercel --prod` built a production deployment that
      # never went live while CI stayed green (two deployments, 2026-09-30).
      # --skip-domain makes "build, don't go live" explicit whatever that setting
      # says; promotion then happens only in the step whose job it is, and the
      # live check proves it. See issue #132.
      #
      # APP_COMMIT_SHA is --env (run-time), not --build-env: /api/health reads it
      # from process.env when it serves, it is not inlined at build.
      #
      # stdout of `vercel deploy` is the deployment URL when stdout is not a TTY
      # (progress goes to stderr). The capture still takes only the last line
      # that looks like a URL and fails if there is none, rather than trusting
      # the whole of stdout.
      - name: Deploy to Vercel (production, not yet live)
        id: deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          out="$(pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prod --skip-domain --yes \
            --env "APP_COMMIT_SHA=${GITHUB_SHA}" --token="$VERCEL_TOKEN")"
          url="$(printf '%s\n' "$out" | grep -E '^https://[^[:space:]]+$' | tail -n 1 || true)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy printed no deployment URL on stdout"
            exit 1
          fi
          echo "Deployment: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Promotion goes through the REST API, not `vercel promote`. The CLI's promote
      # command first loads the token's user (GET /v2/user), and this project's
      # token has none: the step failed with "Not able to load user because of
      # unexpected error: User not found. (404)" (#132, run 37112551983). `deploy`
      # never needs the user, which is why it works. These are the two calls
      # vercel@62.1.0's promote makes after that lookup (getDeployment,
      # requestPromote): resolve the deployment id from its URL, then
      # POST /v10/projects/{project}/promote/{deployment}. The API answers before
      # the alias moves; the live check below is what waits for and proves it.
      # Failures are written as ::error:: annotations so they are readable from
      # the API, not only from the step log.
      - name: Promote to evidoxa.com
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          api="https://api.vercel.com"
          team=""
          case "$VERCEL_ORG_ID" in team_*) team="teamId=$VERCEL_ORG_ID" ;; esac
          host="${DEPLOYMENT_URL#https://}"
          host="${host%%/*}"

          code="$(curl -sS -o deployment.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$api/v13/deployments/$host?$team")"
          if [ "$code" != "200" ]; then
            echo "::error::deployment lookup for $host returned HTTP $code: $(head -c 300 deployment.json)"
            exit 1
          fi
          id="$(jq -r '.id // empty' deployment.json)"
          target="$(jq -r '.target // empty' deployment.json)"
          if [ -z "$id" ] || [ "$target" != "production" ]; then
            echo "::error::deployment $host has id='$id' target='$target'; expected a production deployment"
            exit 1
          fi

          code="$(curl -sS -o promote.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d '{}' \
            "$api/v10/projects/$VERCEL_PROJECT_ID/promote/$id?$team")"
          case "$code" in
            200|201|202) echo "Promotion of $id requested (HTTP $code)." ;;
            *)
              echo "::error::promote of $id returned HTTP $code: $(head -c 300 promote.json)"
              exit 1
              ;;
          esac
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # The only check that the public domain serves what was just deployed. The
      # marker is attached per-request by the instance answering (not cached in
      # Redis), so an old deployment cannot satisfy it. Polling absorbs edge
      # propagation delay: 30 tries x 10s.
      - name: Assert the public domain serves this commit
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          got="unreachable"
          for i in $(seq 1 30); do
            got="$(curl -fsS "$HEALTH_URL" | jq -r '.commit // "null"')" || got="unreachable"
            if [ "$got" = "$GITHUB_SHA" ]; then
              echo "live: $got"
              exit 0
            fi
            echo "attempt $i/30: $HEALTH_URL serves $got, waiting for $GITHUB_SHA"
            sleep 10
          done
          echo "::error::www.evidoxa.com serves $got, expected $GITHUB_SHA"
          exit 1
        env:
          HEALTH_URL: https://www.evidoxa.com/api/health

      # always(): a failed or cancelled-mid-job run must not leak the branch.
      # A cancellation that kills the runner outright still leaks one — that is
      # what expires_at and the reaper step at the top of the job are for.
      - name: Delete ephemeral Neon branch
        if: always() && env.NEON_CI_BRANCH_ID != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "$NEON_API/projects/$NEON_PROJECT_ID/branches/$NEON_CI_BRANCH_ID")"
          echo "DELETE $NEON_CI_BRANCH_ID -> HTTP $code"
          case "$code" in 200|404) ;; *) exit 1 ;; esac
